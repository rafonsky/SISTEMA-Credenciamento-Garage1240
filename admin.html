<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Gestão de Eventos</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel2: #22262f;
    --border: #2a2e38;
    --text: #eef0f3;
    --muted: #8b93a3;
    --ok: #2fbf71;
    --err: #e0533d;
    --accent: #4f8cff;
    --accent-hover: #3d7ae0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  .hidden { display: none !important; }

  /* ---------- LOGIN ---------- */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-box {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }
  .login-box h1 { font-size: 20px; margin: 0 0 24px; text-align: center; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%;
    padding: 10px 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.secondary { background: var(--panel2); border: 1px solid var(--border); }
  .btn.small { width: auto; padding: 8px 14px; font-size: 13px; }
  .error-msg { color: var(--err); font-size: 13px; margin-top: 8px; text-align: center; }

  /* ---------- DASHBOARD ---------- */
  #dashboard { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .top-bar h1 { font-size: 18px; margin: 0; }
  .top-bar .user-info { font-size: 13px; color: var(--muted); }
  .top-bar .user-info b { color: var(--text); }

  .section-header { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 12px; }
  .section-header h2 { font-size: 15px; color: var(--muted); margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }

  .event-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .event-card { position: relative; }
  .event-card h3 { margin: 0 0 4px; font-size: 17px; }
  .event-card .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .event-card .salas-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .event-card .card-actions {
    position: absolute; top: 18px; right: 20px; display: flex; gap: 14px;
  }
  .event-card .card-actions a { font-size: 13px; color: var(--muted); text-decoration: none; cursor: pointer; }
  .event-card .card-actions a:hover { color: var(--text); }
  .event-card .card-actions a.danger:hover { color: var(--err); }
  .sala-tag {
    font-size: 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    color: var(--muted);
  }
  .empty-state { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 50;
  }
  .modal {
    width: 100%; max-width: 520px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
  }
  .modal h2 { margin: 0 0 20px; font-size: 18px; }
  .sala-row {
    display: grid;
    grid-template-columns: 1fr 90px 130px 32px;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .sala-row input, .sala-row select {
    padding: 8px 10px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px; width: 100%;
  }
  .remove-sala { background: none; border: none; color: var(--err); font-size: 18px; cursor: pointer; }
  .add-sala-btn {
    background: none; border: 1px dashed var(--border); color: var(--muted);
    padding: 8px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 13px; margin: 8px 0 20px;
  }
  .modal-actions { display: flex; gap: 10px; }
</style>
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="loginScreen">
    <div class="login-box">
      <h1>Painel — Gestão de Eventos</h1>
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="loginSenha" placeholder="••••••••">
      </div>
      <button class="btn" id="btnLogin">Entrar</button>
      <div style="text-align:center; color: var(--muted); font-size: 12px; margin: 14px 0;">ou</div>
      <button class="btn secondary" id="btnLoginGoogle">Entrar com Google</button>
      <div class="error-msg hidden" id="loginError"></div>
    </div>
  </div>

  <!-- ===================== DASHBOARD ===================== -->
  <div id="dashboard" class="hidden">
    <div class="top-bar">
      <h1>Eventos</h1>
      <div class="user-info">
        <b id="userNome"></b> — <span id="userPapel"></span>
        &nbsp;·&nbsp;<a href="#" id="btnVincularGoogle" style="color: var(--muted);">Vincular conta Google</a>
        &nbsp;·&nbsp;<a href="#" id="btnLogout" style="color: var(--muted);">Sair</a>
      </div>
    </div>

    <div class="section-header">
      <h2>Seus eventos</h2>
      <button class="btn small" id="btnNovoEvento">+ Novo evento</button>
    </div>

    <div id="eventsList"></div>
  </div>

  <!-- ===================== MODAL: NOVO EVENTO ===================== -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitulo">Novo evento</h2>
      <input type="hidden" id="eventoIdEditando" value="">
      <div class="field">
        <label>Nome do evento</label>
        <input type="text" id="eventoNome" placeholder="Ex: Congresso do Cuidado 2026">
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="eventoData">
      </div>
      <div class="field">
        <label>Local</label>
        <input type="text" id="eventoLocal" placeholder="Ex: Curitiba, PR">
      </div>

      <div class="field">
        <label>Salas</label>
        <div id="salasContainer"></div>
        <button type="button" class="add-sala-btn" id="btnAddSala">+ adicionar sala</button>
      </div>

      <div class="modal-actions">
        <button class="btn secondary" id="btnCancelarEvento">Cancelar</button>
        <button class="btn" id="btnSalvarEvento">Salvar evento</button>
      </div>
      <div class="error-msg hidden" id="eventoError"></div>
    </div>
  </div>

<!-- ====================== FIREBASE ====================== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDOj-DrSShS0mTCKsHCPI57zYQx1hAGDsA",
    authDomain: "checkin-de-participantes.firebaseapp.com",
    projectId: "checkin-de-participantes",
    storageBucket: "checkin-de-participantes.firebasestorage.app",
    messagingSenderId: "146226402909",
    appId: "1:146226402909:web:50f7f5c95a366894439fb4"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let usuarioAtual = null; // { uid, nome, papel, eventos_permitidos }

  // ---------- LOGIN ----------
  document.getElementById("btnLogin").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    const senha = document.getElementById("loginSenha").value;
    const errEl = document.getElementById("loginError");
    errEl.classList.add("hidden");
    try {
      await auth.signInWithEmailAndPassword(email, senha);
    } catch (e) {
      errEl.textContent = "E-mail ou senha inválidos.";
      errEl.classList.remove("hidden");
    }
  });

  document.getElementById("btnLogout").addEventListener("click", (e) => {
    e.preventDefault();
    auth.signOut();
  });

  const googleProvider = new firebase.auth.GoogleAuthProvider();

  document.getElementById("btnLoginGoogle").addEventListener("click", async () => {
    const errEl = document.getElementById("loginError");
    errEl.classList.add("hidden");
    try {
      await auth.signInWithPopup(googleProvider);
    } catch (e) {
      if (e.code === "auth/account-exists-with-different-credential") {
        errEl.textContent = "Este e-mail já tem conta por senha. Faça login com e-mail/senha e use \"Vincular conta Google\" no painel.";
      } else {
        errEl.textContent = "Não foi possível entrar com Google: " + e.message;
      }
      errEl.classList.remove("hidden");
    }
  });

  document.getElementById("btnVincularGoogle").addEventListener("click", async (e) => {
    e.preventDefault();
    try {
      await auth.currentUser.linkWithPopup(googleProvider);
      alert("Conta Google vinculada com sucesso. Agora você pode entrar com e-mail/senha OU com Google.");
    } catch (e) {
      if (e.code === "auth/credential-already-in-use") {
        alert("Essa conta Google já está vinculada a outro usuário.");
      } else {
        alert("Erro ao vincular: " + e.message);
      }
    }
  });

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      usuarioAtual = null;
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("dashboard").classList.add("hidden");
      return;
    }

    const doc = await db.collection("usuarios").doc(user.uid).get();
    if (!doc.exists) {
      document.getElementById("loginError").textContent = "Usuário sem permissão cadastrada. Contate o Master.";
      document.getElementById("loginError").classList.remove("hidden");
      auth.signOut();
      return;
    }

    const dados = doc.data();
    usuarioAtual = { uid: user.uid, ...dados };

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("userNome").textContent = dados.nome || user.email;
    document.getElementById("userPapel").textContent = dados.papel === "master" ? "Master" : "Admin";

    carregarEventos();
  });

  // ---------- CARREGAR EVENTOS ----------
  async function carregarEventos() {
    const listEl = document.getElementById("eventsList");
    listEl.innerHTML = "<div class='empty-state'>Carregando…</div>";

    let query = db.collection("eventos").orderBy("data", "desc");
    const snap = await query.get();

    let eventos = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    // Admin só vê os eventos permitidos
    if (usuarioAtual.papel !== "master") {
      const permitidos = usuarioAtual.eventos_permitidos || [];
      eventos = eventos.filter(ev => permitidos.includes(ev.id));
    }

    if (eventos.length === 0) {
      listEl.innerHTML = "<div class='empty-state'>Nenhum evento ainda. Clique em \"+ Novo evento\" pra começar.</div>";
      return;
    }

    listEl.innerHTML = "";
    eventos.forEach(ev => {
      const div = document.createElement("div");
      div.className = "event-card";
      const salasHtml = (ev.salas || []).map(s =>
        `<span class="sala-tag">${s.nome} · ${s.qtd_leitores} leitor(es) · ${modoLabel(s.modo_estacao)}</span>`
      ).join("");
      div.innerHTML = `
        <div class="card-actions">
          <a class="editar-evento" data-id="${ev.id}">Editar</a>
          <a class="excluir-evento danger" data-id="${ev.id}" data-nome="${ev.nome}">Excluir</a>
        </div>
        <h3>${ev.nome}</h3>
        <div class="meta">${formatarData(ev.data)}${ev.local ? " · " + ev.local : ""}</div>
        <div class="salas-list">${salasHtml || "<span class='sala-tag'>Nenhuma sala configurada</span>"}</div>
      `;
      div.querySelector(".editar-evento").addEventListener("click", () => abrirModalEdicao(ev));
      div.querySelector(".excluir-evento").addEventListener("click", () => excluirEvento(ev.id, ev.nome));
      listEl.appendChild(div);
    });
  }

  async function excluirEvento(id, nome) {
    const confirmado = confirm(`Excluir o evento "${nome}"? Isso remove a configuração do evento (nome, salas, branding). Participantes e check-ins já registrados NÃO são apagados automaticamente — se precisar removê-los também, avise.`);
    if (!confirmado) return;
    await db.collection("eventos").doc(id).delete();
    carregarEventos();
  }

  function modoLabel(modo) {
    return { dropdown: "seleção manual", link: "link direto", login: "login por estação" }[modo] || modo;
  }

  function formatarData(iso) {
    if (!iso) return "";
    const [ano, mes, dia] = iso.split("-");
    return `${dia}/${mes}/${ano}`;
  }

  // ---------- MODAL NOVO EVENTO ----------
  const modalOverlay = document.getElementById("modalOverlay");
  const salasContainer = document.getElementById("salasContainer");

  document.getElementById("btnNovoEvento").addEventListener("click", () => {
    document.getElementById("modalTitulo").textContent = "Novo evento";
    document.getElementById("eventoIdEditando").value = "";
    document.getElementById("eventoNome").value = "";
    document.getElementById("eventoData").value = "";
    document.getElementById("eventoLocal").value = "";
    salasContainer.innerHTML = "";
    document.getElementById("eventoError").classList.add("hidden");
    adicionarLinhaSala();
    modalOverlay.classList.remove("hidden");
  });

  function abrirModalEdicao(ev) {
    document.getElementById("modalTitulo").textContent = "Editar evento";
    document.getElementById("eventoIdEditando").value = ev.id;
    document.getElementById("eventoNome").value = ev.nome || "";
    document.getElementById("eventoData").value = ev.data || "";
    document.getElementById("eventoLocal").value = ev.local || "";
    salasContainer.innerHTML = "";
    document.getElementById("eventoError").classList.add("hidden");
    (ev.salas && ev.salas.length ? ev.salas : [{}]).forEach(s => adicionarLinhaSala(s));
    modalOverlay.classList.remove("hidden");
  }

  document.getElementById("btnCancelarEvento").addEventListener("click", () => {
    modalOverlay.classList.add("hidden");
  });

  document.getElementById("btnAddSala").addEventListener("click", () => adicionarLinhaSala());

  function adicionarLinhaSala(sala) {
    sala = sala || {};
    const row = document.createElement("div");
    row.className = "sala-row";
    row.innerHTML = `
      <input type="text" placeholder="Nome da sala" class="sala-nome" value="${sala.nome || ""}">
      <input type="number" min="1" value="${sala.qtd_leitores || 1}" class="sala-qtd">
      <select class="sala-modo">
        <option value="dropdown">Seleção manual</option>
        <option value="link">Link direto</option>
        <option value="login">Login por estação</option>
      </select>
      <button type="button" class="remove-sala">✕</button>
    `;
    if (sala.modo_estacao) row.querySelector(".sala-modo").value = sala.modo_estacao;
    row.querySelector(".remove-sala").addEventListener("click", () => row.remove());
    salasContainer.appendChild(row);
  }

  document.getElementById("btnSalvarEvento").addEventListener("click", async () => {
    const nome = document.getElementById("eventoNome").value.trim();
    const data = document.getElementById("eventoData").value;
    const local = document.getElementById("eventoLocal").value.trim();
    const errEl = document.getElementById("eventoError");

    if (!nome || !data) {
      errEl.textContent = "Preencha nome e data do evento.";
      errEl.classList.remove("hidden");
      return;
    }

    const salas = [...salasContainer.querySelectorAll(".sala-row")].map((row, i) => ({
      id: "sala-" + (i + 1),
      nome: row.querySelector(".sala-nome").value.trim() || `Sala ${i + 1}`,
      qtd_leitores: parseInt(row.querySelector(".sala-qtd").value) || 1,
      modo_estacao: row.querySelector(".sala-modo").value,
    }));

    const idEditando = document.getElementById("eventoIdEditando").value;

    try {
      if (idEditando) {
        await db.collection("eventos").doc(idEditando).update({ nome, data, local, salas });
      } else {
        await db.collection("eventos").add({
          nome, data, local, salas,
          branding: { logo_cliente_url: null, logos_patrocinadores: [], cor_primaria: null, layout_id: null },
          criado_em: firebase.firestore.FieldValue.serverTimestamp(),
          criado_por: usuarioAtual.uid,
        });
      }
      modalOverlay.classList.add("hidden");
      carregarEventos();
    } catch (e) {
      errEl.textContent = "Erro ao salvar: " + e.message;
      errEl.classList.remove("hidden");
    }
  });
</script>

</body>
</html>
