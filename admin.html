<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Gestão de Eventos</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel2: #22262f;
    --border: #2a2e38;
    --text: #eef0f3;
    --muted: #8b93a3;
    --ok: #2fbf71;
    --err: #e0533d;
    --accent: #4f8cff;
    --accent-hover: #3d7ae0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  .hidden { display: none !important; }

  /* ---------- LOGIN ---------- */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-box {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }
  .login-box h1 { font-size: 20px; margin: 0 0 24px; text-align: center; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%;
    padding: 10px 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.secondary { background: var(--panel2); border: 1px solid var(--border); }
  .btn.small { width: auto; padding: 8px 14px; font-size: 13px; }
  .error-msg { color: var(--err); font-size: 13px; margin-top: 8px; text-align: center; }

  /* ---------- DASHBOARD ---------- */
  #dashboard { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .top-bar h1 { font-size: 18px; margin: 0; }
  .top-bar .user-info { font-size: 13px; color: var(--muted); }
  .top-bar .user-info b { color: var(--text); }

  .section-header { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 12px; }
  .section-header h2 { font-size: 15px; color: var(--muted); margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }

  .event-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .event-card { position: relative; }
  .event-card h3 { margin: 0 0 4px; font-size: 17px; }
  .event-card .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .event-card .salas-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .event-card .card-actions {
    position: absolute; top: 18px; right: 20px; display: flex; gap: 14px;
  }
  .event-card .card-actions a { font-size: 13px; color: var(--muted); text-decoration: none; cursor: pointer; }
  .event-card .card-actions a:hover { color: var(--text); }
  .event-card .card-actions a.danger:hover { color: var(--err); }
  .sala-tag {
    font-size: 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    color: var(--muted);
  }
  .empty-state { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 50;
  }
  .modal {
    width: 100%; max-width: 520px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
  }
  .modal h2 { margin: 0 0 20px; font-size: 18px; }
  .sala-row-wrapper { margin-bottom: 10px; }
  .sala-row {
    display: grid;
    grid-template-columns: 1fr 90px 130px 32px;
    gap: 8px;
    align-items: center;
  }
  .sala-row input, .sala-row select {
    padding: 8px 10px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px; width: 100%;
  }
  .remove-sala { background: none; border: none; color: var(--err); font-size: 18px; cursor: pointer; }
  .sala-login-config {
    display: grid;
    grid-template-columns: 1fr 130px;
    gap: 8px;
    margin-top: 6px;
    padding-left: 2px;
  }
  .sala-login-config input, .sala-login-config select {
    padding: 8px 10px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px; width: 100%;
  }
  .add-sala-btn {
    background: none; border: 1px dashed var(--border); color: var(--muted);
    padding: 8px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 13px; margin: 8px 0 20px;
  }
  .modal-actions { display: flex; gap: 10px; }

  .consulta-resultado-item {
    width: 100%; text-align: left; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 6px; color: var(--text);
    cursor: pointer; font-size: 13px;
  }
  .consulta-resultado-item:hover { border-color: var(--accent); }
  .consulta-resultado-item small { display: block; color: var(--muted); }
  .consulta-atual {
    background: var(--panel2); border: 1px solid var(--accent);
    border-radius: 10px; padding: 12px 14px; margin: 14px 0 10px;
  }
  .consulta-atual .label { font-size: 12px; color: var(--muted); }
  .consulta-atual .valor { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .consulta-atual .aviso { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .consulta-historico-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .consulta-historico-table th, .consulta-historico-table td {
    text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border);
  }
  .consulta-historico-table th { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="loginScreen">
    <div class="login-box">
      <h1>Painel — Gestão de Eventos</h1>
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="loginSenha" placeholder="••••••••">
      </div>
      <button class="btn" id="btnLogin">Entrar</button>
      <div style="text-align:center; color: var(--muted); font-size: 12px; margin: 14px 0;">ou</div>
      <button class="btn secondary" id="btnLoginGoogle">Entrar com Google</button>
      <div class="error-msg hidden" id="loginError"></div>
    </div>
  </div>

  <!-- ===================== DASHBOARD ===================== -->
  <div id="dashboard" class="hidden">
    <div class="top-bar">
      <h1>Eventos</h1>
      <div class="user-info">
        <b id="userNome"></b> — <span id="userPapel"></span>
        &nbsp;·&nbsp;<a href="#" id="btnConsultaPresenca" class="hidden" style="color: var(--muted);">Consultar presença</a>
        &nbsp;·&nbsp;<a href="#" id="btnVincularGoogle" style="color: var(--muted);">Vincular conta Google</a>
        &nbsp;·&nbsp;<a href="#" id="btnLogout" style="color: var(--muted);">Sair</a>
      </div>
    </div>

    <div class="section-header">
      <h2>Seus eventos</h2>
      <button class="btn small" id="btnNovoEvento">+ Novo evento</button>
    </div>

    <div id="eventsList"></div>
  </div>

  <!-- ===================== MODAL: NOVO EVENTO ===================== -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitulo">Novo evento</h2>
      <input type="hidden" id="eventoIdEditando" value="">
      <div class="field">
        <label>Nome do evento</label>
        <input type="text" id="eventoNome" placeholder="Ex: Congresso do Cuidado 2026">
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="eventoData">
      </div>
      <div class="field">
        <label>Local</label>
        <input type="text" id="eventoLocal" placeholder="Ex: Curitiba, PR">
      </div>

      <div class="field">
        <label>Salas</label>
        <div id="salasContainer"></div>
        <button type="button" class="add-sala-btn" id="btnAddSala">+ adicionar sala</button>
      </div>

      <div class="modal-actions">
        <button class="btn secondary" id="btnCancelarEvento">Cancelar</button>
        <button class="btn" id="btnSalvarEvento">Salvar evento</button>
      </div>
      <div class="error-msg hidden" id="eventoError"></div>
    </div>
  </div>

  <!-- ===================== MODAL: CONSULTAR PRESENÇA (só master) ===================== -->
  <div class="modal-overlay hidden" id="modalConsultaOverlay">
    <div class="modal">
      <h2>Consultar presença</h2>
      <div class="field">
        <label>Evento</label>
        <select id="consultaEventoSelect"><option value="">Selecione um evento…</option></select>
      </div>
      <div class="field">
        <label>Nome ou código do participante</label>
        <input type="text" id="consultaBusca" placeholder="Digite pelo menos 2 letras…" disabled>
      </div>
      <div id="consultaResultados"></div>
      <div id="consultaHistorico" class="hidden"></div>
      <div class="modal-actions">
        <button class="btn secondary" id="btnFecharConsulta">Fechar</button>
      </div>
      <div class="error-msg hidden" id="consultaError"></div>
    </div>
  </div>

<!-- ====================== FIREBASE ====================== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDOj-DrSShS0mTCKsHCPI57zYQx1hAGDsA",
    authDomain: "checkin-de-participantes.firebaseapp.com",
    projectId: "checkin-de-participantes",
    storageBucket: "checkin-de-participantes.firebasestorage.app",
    messagingSenderId: "146226402909",
    appId: "1:146226402909:web:50f7f5c95a366894439fb4"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let usuarioAtual = null; // { uid, nome, papel, eventos_permitidos }

  // ---------- LOGIN ----------
  document.getElementById("btnLogin").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    const senha = document.getElementById("loginSenha").value;
    const errEl = document.getElementById("loginError");
    errEl.classList.add("hidden");
    try {
      await auth.signInWithEmailAndPassword(email, senha);
    } catch (e) {
      errEl.textContent = "E-mail ou senha inválidos.";
      errEl.classList.remove("hidden");
    }
  });

  document.getElementById("btnLogout").addEventListener("click", (e) => {
    e.preventDefault();
    auth.signOut();
  });

  const googleProvider = new firebase.auth.GoogleAuthProvider();

  document.getElementById("btnLoginGoogle").addEventListener("click", async () => {
    const errEl = document.getElementById("loginError");
    errEl.classList.add("hidden");
    try {
      await auth.signInWithPopup(googleProvider);
    } catch (e) {
      if (e.code === "auth/account-exists-with-different-credential") {
        errEl.textContent = "Este e-mail já tem conta por senha. Faça login com e-mail/senha e use \"Vincular conta Google\" no painel.";
      } else {
        errEl.textContent = "Não foi possível entrar com Google: " + e.message;
      }
      errEl.classList.remove("hidden");
    }
  });

  document.getElementById("btnVincularGoogle").addEventListener("click", async (e) => {
    e.preventDefault();
    try {
      await auth.currentUser.linkWithPopup(googleProvider);
      alert("Conta Google vinculada com sucesso. Agora você pode entrar com e-mail/senha OU com Google.");
    } catch (e) {
      if (e.code === "auth/credential-already-in-use") {
        alert("Essa conta Google já está vinculada a outro usuário.");
      } else {
        alert("Erro ao vincular: " + e.message);
      }
    }
  });

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      usuarioAtual = null;
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("dashboard").classList.add("hidden");
      return;
    }

    const doc = await db.collection("usuarios").doc(user.uid).get();
    if (!doc.exists) {
      document.getElementById("loginError").textContent = "Usuário sem permissão cadastrada. Contate o Master.";
      document.getElementById("loginError").classList.remove("hidden");
      auth.signOut();
      return;
    }

    const dados = doc.data();
    usuarioAtual = { uid: user.uid, ...dados };

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("userNome").textContent = dados.nome || user.email;
    document.getElementById("userPapel").textContent = dados.papel === "master" ? "Master" : "Admin";
    document.getElementById("btnConsultaPresenca").classList.toggle("hidden", dados.papel !== "master");

    carregarEventos();
  });

  // ---------- CARREGAR EVENTOS ----------
  async function carregarEventos() {
    const listEl = document.getElementById("eventsList");
    listEl.innerHTML = "<div class='empty-state'>Carregando…</div>";

    let query = db.collection("eventos").orderBy("data", "desc");
    const snap = await query.get();

    let eventos = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    // Admin só vê os eventos permitidos
    if (usuarioAtual.papel !== "master") {
      const permitidos = usuarioAtual.eventos_permitidos || [];
      eventos = eventos.filter(ev => permitidos.includes(ev.id));
    }

    if (eventos.length === 0) {
      listEl.innerHTML = "<div class='empty-state'>Nenhum evento ainda. Clique em \"+ Novo evento\" pra começar.</div>";
      return;
    }

    listEl.innerHTML = "";
    eventos.forEach(ev => {
      const div = document.createElement("div");
      div.className = "event-card";
      const salasHtml = (ev.salas || []).map(s =>
        `<span class="sala-tag">${s.nome} · ${s.qtd_leitores} leitor(es) · ${modoLabel(s.modo_estacao)}
          <a href="#" class="copiar-link-sala" data-evento="${ev.id}" data-sala="${s.id}" title="Copiar link de check-in desta sala" style="margin-left:6px; color: var(--accent);">🔗</a>
        </span>`
      ).join("");
      div.innerHTML = `
        <div class="card-actions">
          <a class="editar-evento" data-id="${ev.id}">Editar</a>
          <a class="excluir-evento danger" data-id="${ev.id}" data-nome="${ev.nome}">Excluir</a>
        </div>
        <h3>${ev.nome}</h3>
        <div class="meta">${formatarData(ev.data)}${ev.local ? " · " + ev.local : ""}</div>
        <div class="salas-list">${salasHtml || "<span class='sala-tag'>Nenhuma sala configurada</span>"}</div>
      `;
      div.querySelector(".editar-evento").addEventListener("click", () => abrirModalEdicao(ev));
      div.querySelector(".excluir-evento").addEventListener("click", () => excluirEvento(ev.id, ev.nome));
      div.querySelectorAll(".copiar-link-sala").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          copiarLinkSala(a.dataset.evento, a.dataset.sala);
        });
      });
      listEl.appendChild(div);
    });
  }

  function copiarLinkSala(eventoId, salaId) {
    const url = new URL("checkin.html", location.href);
    url.searchParams.set("evento", eventoId);
    url.searchParams.set("sala", salaId);
    navigator.clipboard.writeText(url.toString())
      .then(() => alert("Link copiado:\n" + url.toString()))
      .catch(() => prompt("Copie o link abaixo:", url.toString()));
  }

  async function excluirEvento(id, nome) {
    const confirmado = confirm(`Excluir o evento "${nome}"? Isso remove a configuração do evento (nome, salas, branding). Participantes e check-ins já registrados NÃO são apagados automaticamente — se precisar removê-los também, avise.`);
    if (!confirmado) return;
    await db.collection("eventos").doc(id).delete();
    carregarEventos();
  }

  function modoLabel(modo) {
    return { dropdown: "seleção manual", link: "link direto", login: "login por estação" }[modo] || modo;
  }

  function formatarData(iso) {
    if (!iso) return "";
    const [ano, mes, dia] = iso.split("-");
    return `${dia}/${mes}/${ano}`;
  }

  // ---------- MODAL NOVO EVENTO ----------
  const modalOverlay = document.getElementById("modalOverlay");
  const salasContainer = document.getElementById("salasContainer");

  document.getElementById("btnNovoEvento").addEventListener("click", () => {
    document.getElementById("modalTitulo").textContent = "Novo evento";
    document.getElementById("eventoIdEditando").value = "";
    document.getElementById("eventoNome").value = "";
    document.getElementById("eventoData").value = "";
    document.getElementById("eventoLocal").value = "";
    salasContainer.innerHTML = "";
    document.getElementById("eventoError").classList.add("hidden");
    adicionarLinhaSala();
    modalOverlay.classList.remove("hidden");
  });

  function abrirModalEdicao(ev) {
    document.getElementById("modalTitulo").textContent = "Editar evento";
    document.getElementById("eventoIdEditando").value = ev.id;
    document.getElementById("eventoNome").value = ev.nome || "";
    document.getElementById("eventoData").value = ev.data || "";
    document.getElementById("eventoLocal").value = ev.local || "";
    salasContainer.innerHTML = "";
    document.getElementById("eventoError").classList.add("hidden");
    (ev.salas && ev.salas.length ? ev.salas : [{}]).forEach(s => adicionarLinhaSala(s));
    modalOverlay.classList.remove("hidden");
  }

  document.getElementById("btnCancelarEvento").addEventListener("click", () => {
    modalOverlay.classList.add("hidden");
  });

  document.getElementById("btnAddSala").addEventListener("click", () => adicionarLinhaSala());

  function adicionarLinhaSala(sala) {
    sala = sala || {};
    const wrapper = document.createElement("div");
    wrapper.className = "sala-row-wrapper";
    wrapper.innerHTML = `
      <div class="sala-row">
        <input type="text" placeholder="Nome da sala" class="sala-nome" value="${sala.nome || ""}">
        <input type="number" min="1" value="${sala.qtd_leitores || 1}" class="sala-qtd">
        <select class="sala-modo">
          <option value="dropdown">Seleção manual</option>
          <option value="link">Link direto</option>
          <option value="login">Login por estação</option>
        </select>
        <button type="button" class="remove-sala">✕</button>
      </div>
      <div class="sala-login-config hidden">
        <select class="sala-login-metodo">
          <option value="pin">PIN da sala</option>
          <option value="conta">Conta do painel (e-mail/senha ou Google)</option>
        </select>
        <input type="text" placeholder="PIN (4-6 dígitos)" maxlength="6" class="sala-pin">
      </div>
    `;
    if (sala.id) wrapper.dataset.salaId = sala.id;
    if (sala.modo_estacao) wrapper.querySelector(".sala-modo").value = sala.modo_estacao;
    if (sala.login_metodo) wrapper.querySelector(".sala-login-metodo").value = sala.login_metodo;
    if (sala.pin) wrapper.querySelector(".sala-pin").value = sala.pin;

    const modoSelect = wrapper.querySelector(".sala-modo");
    const loginConfig = wrapper.querySelector(".sala-login-config");
    const metodoSelect = wrapper.querySelector(".sala-login-metodo");
    const pinInput = wrapper.querySelector(".sala-pin");

    function atualizarVisibilidadeLogin() {
      loginConfig.classList.toggle("hidden", modoSelect.value !== "login");
      pinInput.classList.toggle("hidden", metodoSelect.value !== "pin");
    }
    modoSelect.addEventListener("change", atualizarVisibilidadeLogin);
    metodoSelect.addEventListener("change", atualizarVisibilidadeLogin);
    atualizarVisibilidadeLogin();

    wrapper.querySelector(".remove-sala").addEventListener("click", () => wrapper.remove());
    salasContainer.appendChild(wrapper);
  }

  document.getElementById("btnSalvarEvento").addEventListener("click", async () => {
    const nome = document.getElementById("eventoNome").value.trim();
    const data = document.getElementById("eventoData").value;
    const local = document.getElementById("eventoLocal").value.trim();
    const errEl = document.getElementById("eventoError");

    if (!nome || !data) {
      errEl.textContent = "Preencha nome e data do evento.";
      errEl.classList.remove("hidden");
      return;
    }

    const salas = [...salasContainer.querySelectorAll(".sala-row-wrapper")].map((wrapper, i) => {
      const modo = wrapper.querySelector(".sala-modo").value;
      const sala = {
        id: wrapper.dataset.salaId || ("sala-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
        nome: wrapper.querySelector(".sala-nome").value.trim() || `Sala ${i + 1}`,
        qtd_leitores: parseInt(wrapper.querySelector(".sala-qtd").value) || 1,
        modo_estacao: modo,
      };
      if (modo === "login") {
        const metodo = wrapper.querySelector(".sala-login-metodo").value;
        sala.login_metodo = metodo;
        if (metodo === "pin") {
          sala.pin = wrapper.querySelector(".sala-pin").value.trim();
        }
      }
      return sala;
    });

    const idEditando = document.getElementById("eventoIdEditando").value;

    try {
      if (idEditando) {
        await db.collection("eventos").doc(idEditando).update({ nome, data, local, salas });
      } else {
        await db.collection("eventos").add({
          nome, data, local, salas,
          branding: { logo_cliente_url: null, logos_patrocinadores: [], cor_primaria: null, layout_id: null },
          criado_em: firebase.firestore.FieldValue.serverTimestamp(),
          criado_por: usuarioAtual.uid,
        });
      }
      modalOverlay.classList.add("hidden");
      carregarEventos();
    } catch (e) {
      errEl.textContent = "Erro ao salvar: " + e.message;
      errEl.classList.remove("hidden");
    }
  });

  // ---------- CONSULTAR PRESENÇA (só master) ----------
  // Obs: a restrição a "só master" aqui é feita na interface, do mesmo jeito
  // que o resto do painel já filtra o que aparece por papel — as regras do
  // Firestore continuam permitindo leitura a qualquer usuário autenticado,
  // então não é uma barreira de segurança, é só o app escondendo a opção.
  const modalConsultaOverlay = document.getElementById("modalConsultaOverlay");
  const consultaEventoSelect = document.getElementById("consultaEventoSelect");
  const consultaBusca = document.getElementById("consultaBusca");
  const consultaResultados = document.getElementById("consultaResultados");
  const consultaHistorico = document.getElementById("consultaHistorico");

  let consultaParticipantesCache = new Map();
  let consultaSalasPorId = new Map();

  document.getElementById("btnConsultaPresenca").addEventListener("click", async (e) => {
    e.preventDefault();
    document.getElementById("consultaError").classList.add("hidden");
    consultaBusca.value = "";
    consultaBusca.disabled = true;
    consultaResultados.innerHTML = "";
    consultaHistorico.classList.add("hidden");
    consultaParticipantesCache = new Map();

    consultaEventoSelect.innerHTML = "<option value=''>Carregando eventos…</option>";
    modalConsultaOverlay.classList.remove("hidden");

    const snap = await db.collection("eventos").orderBy("data", "desc").get();
    consultaEventoSelect.innerHTML = "<option value=''>Selecione um evento…</option>";
    snap.forEach(d => {
      const ev = d.data();
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = ev.nome;
      opt.dataset.salas = JSON.stringify(ev.salas || []);
      consultaEventoSelect.appendChild(opt);
    });
  });

  document.getElementById("btnFecharConsulta").addEventListener("click", () => {
    modalConsultaOverlay.classList.add("hidden");
  });

  consultaEventoSelect.addEventListener("change", async () => {
    const eventoId = consultaEventoSelect.value;
    consultaResultados.innerHTML = "";
    consultaHistorico.classList.add("hidden");
    consultaBusca.value = "";
    if (!eventoId) {
      consultaBusca.disabled = true;
      return;
    }

    const opt = consultaEventoSelect.selectedOptions[0];
    consultaSalasPorId = new Map((JSON.parse(opt.dataset.salas || "[]")).map(s => [s.id, s.nome]));

    consultaBusca.disabled = true;
    consultaBusca.placeholder = "Carregando participantes…";
    try {
      const snap = await db.collection("participantes").doc(eventoId).collection("lista").get();
      consultaParticipantesCache = new Map();
      snap.forEach(d => consultaParticipantesCache.set(d.id, d.data()));
      consultaBusca.placeholder = `Digite pelo menos 2 letras… (${consultaParticipantesCache.size} participantes)`;
      consultaBusca.disabled = false;
    } catch (e) {
      document.getElementById("consultaError").textContent = "Erro ao carregar participantes: " + e.message;
      document.getElementById("consultaError").classList.remove("hidden");
    }
  });

  consultaBusca.addEventListener("input", () => {
    const termo = consultaBusca.value.trim().toLowerCase();
    consultaHistorico.classList.add("hidden");
    if (termo.length < 2) {
      consultaResultados.innerHTML = "";
      return;
    }
    const encontrados = [];
    consultaParticipantesCache.forEach((p, codigo) => {
      const alvo = `${p.nome || ""} ${p.nome_cracha || ""} ${codigo}`.toLowerCase();
      if (alvo.includes(termo)) encontrados.push({ codigo, ...p });
    });
    consultaResultados.innerHTML = "";
    if (!encontrados.length) {
      consultaResultados.innerHTML = "<div class='empty-state'>Nenhum participante encontrado.</div>";
      return;
    }
    encontrados.slice(0, 20).forEach(p => {
      const div = document.createElement("div");
      div.className = "consulta-resultado-item";
      div.innerHTML = `${p.nome_cracha || p.nome || p.codigo}<small>${p.codigo}${p.orgao ? " · " + p.orgao : ""}</small>`;
      div.addEventListener("click", () => mostrarHistoricoParticipante(p));
      consultaResultados.appendChild(div);
    });
  });

  async function mostrarHistoricoParticipante(participante) {
    const eventoId = consultaEventoSelect.value;
    consultaHistorico.classList.remove("hidden");
    consultaHistorico.innerHTML = "<div class='empty-state'>Carregando histórico…</div>";
    try {
      const snap = await db.collection("checkins").doc(eventoId).collection("logs")
        .where("participante_id", "==", participante.codigo)
        .get();
      const registros = snap.docs.map(d => {
        const data = d.data();
        const ts = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp_local);
        return { ts, sala: consultaSalasPorId.get(data.sala) || data.sala_nome || data.sala };
      }).sort((a, b) => b.ts - a.ts);

      if (!registros.length) {
        consultaHistorico.innerHTML = "<div class='empty-state'>Nenhum check-in registrado pra este participante neste evento.</div>";
        return;
      }

      const ultimo = registros[0];
      const linhas = registros.map(r => `<tr><td>${formatarDataHora(r.ts)}</td><td>${r.sala}</td></tr>`).join("");

      consultaHistorico.innerHTML = `
        <div class="consulta-atual">
          <div class="label">Última leitura registrada</div>
          <div class="valor">${ultimo.sala} · ${formatarDataHora(ultimo.ts)}</div>
          <div class="aviso">Baseado no último check-in — não é rastreamento em tempo real, só indica por onde a pessoa passou por último.</div>
        </div>
        <table class="consulta-historico-table">
          <thead><tr><th>Data/hora</th><th>Sala</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      `;
    } catch (e) {
      consultaHistorico.innerHTML = `<div class='empty-state'>Erro ao carregar histórico: ${e.message}</div>`;
    }
  }

  function formatarDataHora(d) {
    return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }
</script>

</body>
</html>
